version: '3.8'

services:
  # Backend - FastAPI
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gentle-healer-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CORS_ORIGINS=*
    volumes:
      - ./server:/app
      - db_data:/app/data
    networks:
      - gentle-healer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      ollama:
        condition: service_healthy

  # Frontend - React + Vite
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: gentle-healer-frontend
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - gentle-healer-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - gentle-healer-network
    restart: unless-stopped
    # El entrypoint que tienes es correcto para auto-descargar el modelo
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 15 && ollama pull qwen2.5:3b && tail -f /dev/null"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
networks:
  gentle-healer-network:
    driver: bridge
volumes:
  db_data:
    driver: local
  backend_data:
    driver: local
  ollama_data:
    driver: local
