    #entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 15 && ollama pull qwen2.5:3b && tail -f /dev/null"]
    #healthcheck:
     # test: ["CMD-SHELL", "wget -qO- http://localhost:11434/api/tags || exit 1"]
     # interval: 15s
     # timeout: 10s
      #retries: 20
      #start_period: 120s
  frontend-profesionales:
    build:
      context: ./dashboard # Ruta a tu carpeta de Vue
      dockerfile: Dockerfile
      args:
        # Apunta al nombre de tu contenedor backend en docker-compose
        - VITE_API_URL=http://localhost:8000 
    ports:
      - "3000:80" # Podrás verlo en http://localhost:3000
    depends_on:
      - backend # Asegura que el servidor arranque primero
networks:
  gentle-healer-network:
    driver: bridge
volumes:
  db_data:
    driver: local
  backend_data:
