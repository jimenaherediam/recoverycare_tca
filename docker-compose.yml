version: '3.8'

services:
  # Backend - FastAPI
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gentle-healer-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CORS_ORIGINS=*
    volumes:
      - ./server:/app
      - db_data:/app/data
    networks:
      - gentle-healer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    

  # Frontend - React + Vite
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:8000
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: gentle-healer-frontend
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gentle-healer-network
    restart: unless-stopped

  #ollama:
   # image: ollama/ollama:latest
    #container_name: ollama
    #ports:
     # - "11434:11434"
    #volumes:
     # - ollama_data:/root/.ollama
    #networks:
     # - gentle-healer-network
    #restart: unless-stopped
