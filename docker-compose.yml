version: '3.8'

services:
  # Backend - FastAPI
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gentle-healer-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CORS_ORIGINS=*
    volumes:
      - ./server:/app
      - db_data:/app/data
    networks:
      - gentle-healer-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    

  # Frontend - React + Vite
  frontend:
    build:
      context: ./frontend-pacient
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://LAPTOP-NAK9FUKV.local:8000
    container_name: gentle-healer-frontend
    ports:
      - "80:80"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gentle-healer-network
    restart: unless-stopped

  frontend-profesionales:
    build:
      context: ./dashboard # Ruta a tu carpeta de Vue
      dockerfile: Dockerfile
      args:
        # Apunta al nombre de tu contenedor backend en docker-compose
        - VITE_API_URL=http://localhost:8000 
    ports:
      - "3000:80" # Podrás verlo en http://localhost:3000
    depends_on:
      - backend # Asegura que el servidor arranque primero
networks:
  gentle-healer-network:
    driver: bridge
volumes:
  db_data:
    driver: local
  backend_data:
    driver: local
  #ollama_data:
   # driver: local
